name: List test.txt from all repos with GitHub App

on:
  workflow_dispatch:

jobs:
  scan-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # required for repos
    steps:
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh jq

      - name: Authenticate GitHub CLI with App token
        run: echo "${{ steps.app-token.outputs.token }}" | gh auth login --with-token

      - name: List repos and fetch test.txt
        run: |
          gh repo list ${{ github.actor }} --json nameWithOwner -L 1000 | jq -r '.[].nameWithOwner' | while read repo; do
            echo "=== $repo ==="
            # Try fetching raw file; if it fails, print "not found"
            if content=$(gh api repos/$repo/contents/test.txt --silent 2>/dev/null); then
              echo "$content" 
              echo "$content" | jq -r .content | base64 -d              
              echo ""
            else
              echo "test.txt not found"
            fi
          done

