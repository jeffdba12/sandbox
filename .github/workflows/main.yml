name: Lint
on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  tflint:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
      name: Checkout source code

    - uses: actions/cache@v4
      name: Cache plugin dir
      with:
        path: ~/.tflint.d/plugins
        key: ${{ matrix.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

    - uses: terraform-linters/setup-tflint@v4
      name: Setup TFLint
      with:
        tflint_version: v0.52.0

    - name: Show version
      run: tflint --version

    - name: Init TFLint
      run: |
        tflint --init --config=../.tflint.hcl --chdir=abc
        tflint --init --config=../.tflint.hcl --chdir=xyz
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Run TFLint on abc and xyz
      run: |
        EXIT_CODE=0

        tflint --config=../.tflint.hcl --chdir=abc -f compact || EXIT_CODE=$?
        tflint --config=../.tflint.hcl --chdir=xyz -f compact || EXIT_CODE=$?

        exit $EXIT_CODE
