name: Lint

on:
  pull_request:

jobs:
  tflint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache TFLint plugins
      uses: actions/cache@v4
      with:
        path: ~/.tflint.d/plugins
        key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: v0.52.0

    - name: Show TFLint version
      run: tflint --version

    - name: Init TFLint
      run: |
        tflint --init --config=../.tflint.hcl --chdir=abc
        tflint --init --config=../.tflint.hcl --chdir=xyz
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Run TFLint on abc and xyz
      run: |
        EXIT_CODE=0

        tflint --config=../.tflint.hcl --chdir=abc -f compact --minimum-severity=error || EXIT_CODE=$?
        tflint --config=../.tflint.hcl --chdir=xyz -f compact --minimum-severity=error || EXIT_CODE=$?

        exit $EXIT_CODE
